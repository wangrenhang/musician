name: Check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks against production build
        run: |
          npm run preview -- --port 4173 > /tmp/air-strum-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
        env:
          APP_URL: http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
