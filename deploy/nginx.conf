worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  map $uri $asset_cache_control {
    default "no-cache, no-transform";
    ~^/(mediapipe/|models/) "public, max-age=86400, no-transform";
    ~^/assets/ "public, max-age=31536000, immutable, no-transform";
  }
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/wasm application/javascript text/javascript text/css application/json application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 80;
    server_name guitar.dainsu.top;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $asset_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    location / { try_files $uri $uri/ =404; }
  }
}
